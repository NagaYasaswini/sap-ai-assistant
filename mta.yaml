_schema-version: "3.1"
ID: sap-ai-assistant
version: 1.0.0

modules:
  - name: sap-ai-assistant-db-deployer
    type: hdb
    path: gen/db
    requires:
      - name: sap-ai-assistant-hdi

  - name: sap-ai-assistant-srv
    type: nodejs
    path: .
    parameters:
      buildpack: nodejs_buildpack
      memory: 256M
      disk-quota: 512M
    build-parameters:
      builder: npm
      ignore:
        - .env
        - .cdsrc-private.json
    requires:
      - name: sap-ai-assistant-hdi
      - name: sap-ai-assistant-xsuaa

resources:
  - name: sap-ai-assistant-hdi
    type: org.cloudfoundry.managed-service
    parameters:
      service: hana
      service-plan: hdi-shared
      service-name: sap-ai-assistant-hdi
  - name: sap-ai-assistant-xsuaa
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      service-name: sap-ai-assistant-xsuaa
















